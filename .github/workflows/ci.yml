name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "FAIL: go.mod/go.sum not tidy" && exit 1)

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "FAIL: files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

      - name: Test
        run: go test -race ./...

  release:
    name: Release
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Validate release archives
        run: |
          set -euo pipefail
          for tarball in dist/*.tar.gz; do
            echo "==> Checking $tarball"

            contents=$(tar tzf "$tarball")

            if echo "$contents" | grep -qx '\./$\|^\.'; then
              echo "FAIL: $tarball contains a '.' directory entry"
              echo "$contents" | head -20
              exit 1
            fi

            for f in canopy README.md LICENSE config.example.yaml; do
              if ! echo "$contents" | grep -q "$f"; then
                echo "FAIL: $tarball missing $f"
                echo "$contents"
                exit 1
              fi
            done

            echo "  OK"
          done

  publish:
    name: Publish
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # push release tags and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Mint Homebrew tap token
        id: tap-token
        # Mint before tagging, so a credential failure stops the release before the tag exists.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: alcxyz
          repositories: homebrew-tap
          permission-contents: write

      - name: Write AUR SSH key
        # Check the key before tagging, so a missing or malformed key stops the release before the tag exists.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY_CONTENT" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keygen -y -f ~/.ssh/aur_key > /dev/null
          # The AUR host keys, matching the fingerprints published on https://aur.archlinux.org/.
          cat >> ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-rsa 
          EOF
          echo "AUR_KEY_PATH=$HOME/.ssh/aur_key" >> "$GITHUB_ENV"
        env:
          AUR_KEY_CONTENT: ${{ secrets.AUR_KEY }}

      - name: Auto-tag release
        id: tag
        run: |
          VERSION="v$(cat VERSION)"
          if git tag -l "$VERSION" | grep -q . || git ls-remote --tags origin "$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating tag $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        if: steps.tag.outputs.created == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          AUR_KEY: ${{ env.AUR_KEY_PATH }}

  nix:
    name: Nix
    needs: publish
    permissions:
      contents: write # commit vendorHash updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Verify or update vendorHash
        run: |
          set +e
          output=$(nix build .#canopy 2>&1)
          rc=$?
          set -e

          if [ $rc -eq 0 ]; then
            echo "vendorHash is up to date"
            exit 0
          fi

          new_hash=$(echo "$output" | grep "got:" | awk '{print $2}')
          if [ -z "$new_hash" ]; then
            echo "::error::Nix build failed but could not extract new hash"
            echo "$output"
            exit 1
          fi

          echo "Updating vendorHash to $new_hash"
          sed -i "s|vendorHash = \".*\"|vendorHash = \"$new_hash\"|" flake.nix

          nix build .#canopy

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update vendorHash for v$(cat VERSION)"
          git push
